<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="utf-8">
    <title>MDS Theme Design Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../tailwind.css">
    <script type="module" src="../../assets/design.js"></script>
</head>

<body class="bg-slate-100">

    <div class="grid md:grid-cols-2 lg:grid-cols-3 max-w-[1600px] mx-auto p-4 gap-6">
        <!-- column -->
        <div class="space-y-6">

            <div class="divide-y divide-gray-200 overflow-hidden rounded-md bg-white shadow-sm">
                <div class="px-4 py-5 sm:px-6">
                    Default skeleton
                </div>
                <div class="px-4 py-5 sm:p-6">
                    <div role="status" class="skeleton max-w-sm space-y-2">
                        <div class="skeleton-line-md w-48 mb-4"></div>
                        <div class="skeleton-line max-w-[360px] mb-2.5"></div>
                        <div class="skeleton-line mb-2.5"></div>
                        <div class="skeleton-line max-w-[330px] mb-2.5"></div>
                        <div class="skeleton-line max-w-[300px] mb-2.5"></div>
                        <div class="skeleton-line max-w-[360px]"></div>
                        <span class="sr-only">Loading...</span>
                    </div>
                </div>
            </div>

            <div class="divide-y divide-gray-200 overflow-hidden rounded-md bg-white shadow-sm">
                <div class="px-4 py-5 sm:px-6">
                    Text Placeholder Skeleton
                </div>
                <div class="px-4 py-5 sm:p-6">
                    <div role="status" class="skeleton skeleton-text max-w-lg">
                        <div class="skeleton-text-row">
                            <div class="skeleton-line-md w-32"></div>
                            <div class="skeleton-line-md w-24"></div>
                            <div class="skeleton-line-md w-full"></div>
                        </div>
                        <div class="skeleton-text-row">
                            <div class="skeleton-line-md w-full"></div>
                            <div class="skeleton-line-md w-full"></div>
                            <div class="skeleton-line-md w-24"></div>
                        </div>
                        <span class="sr-only">Loading...</span>
                    </div>
                </div>
            </div>

            <div class="divide-y divide-gray-200 overflow-hidden rounded-md bg-white shadow-sm">
                <div class="px-4 py-5 sm:px-6">
                    List Placeholder
                </div>
                <div class="px-4 py-5 sm:p-6">

                    <div role="status" class="skeleton skeleton-list">
                        <div class="skeleton-list-item">
                            <div>
                                <div class="skeleton-line-md w-24 mb-2.5"></div>
                                <div class="skeleton-line w-32"></div>
                            </div>
                            <div class="skeleton-line-md w-12"></div>
                        </div>
                        <div class="skeleton-list-item">
                            <div>
                                <div class="skeleton-line-md w-24 mb-2.5"></div>
                                <div class="skeleton-line w-32"></div>
                            </div>
                            <div class="skeleton-line-md w-12"></div>
                        </div>
                    </div>


                </div>
            </div>

        </div>

        <!-- column -->
        <div class="space-y-6">

            <div class="divide-y divide-gray-200 overflow-hidden rounded-md bg-white shadow-sm">
                <div class="px-4 py-5 sm:px-6">
                    Card Borderless Placeholder
                </div>
                <div class="px-4 py-5 sm:p-6">
                    <div role="status" class="skeleton skeleton-card">
                        <div class="skeleton-media skeleton-media-aspect"></div>
                        <div>
                            <div class="skeleton-line-md w-48 mb-4"></div>
                            <div class="skeleton-line max-w-[480px] mb-2.5"></div>
                            <div class="skeleton-line mb-2.5"></div>
                            <div class="skeleton-line max-w-[440px] mb-2.5"></div>
                            <div class="skeleton-line max-w-[360px]"></div>
                        </div>
                        <span class="sr-only">Loading...</span>
                    </div>
                </div>
            </div>

            <div class="divide-y divide-gray-200 overflow-hidden rounded-md bg-white shadow-sm">
                <div class="px-4 py-5 sm:px-6">
                    Card Border Placeholder
                </div>
                <div class="px-4 py-5 sm:p-6">
                    <div role="status" class="skeleton skeleton-card-bordered">
                        <div class="skeleton-media skeleton-media-aspect"></div>
                        <div>
                            <div class="skeleton-line-md w-48 mb-4"></div>
                            <div class="skeleton-line max-w-[480px] mb-2.5"></div>
                            <div class="skeleton-line mb-2.5"></div>
                            <div class="skeleton-line max-w-[440px] mb-2.5"></div>
                            <div class="skeleton-line max-w-[360px]"></div>
                        </div>
                        <span class="sr-only">Loading...</span>
                    </div>
                </div>
            </div>

        </div>

        <!-- column -->
        <div class="space-y-6">

            <div class="divide-y divide-gray-200 overflow-hidden rounded-md bg-white shadow-sm">
                <div class="px-4 py-5 sm:px-6">
                    Video Placeholder Locked Aspect Ratio
                </div>
                <div class="px-4 py-5 sm:p-6">
                    <div role="status" class="skeleton skeleton-media skeleton-media-aspect">
                        <!-- Image Icon -->
                        <svg class="size-12 text-fg-disabled text-primary-300" aria-hidden="true"
                            xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="m3 16 5-7 6 6.5m6.5 2.5L16 13l-4.286 6M14 10h.01M4 19h16a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1Z" />
                        </svg>
                        <span class="sr-only">Loading...</span>
                    </div>
                </div>
            </div>

            <div class="divide-y divide-gray-200 overflow-hidden rounded-md bg-white shadow-sm">
                <div class="px-4 py-5 sm:px-6">
                    Video Placeholder Fill Parent
                </div>
                <div class="px-4 py-5 sm:p-6 min-h-80 flex">
                    <div role="status" class="skeleton skeleton-media skeleton-media-fill">
                        <!-- Video Icon -->
                        <svg class="size-12 text-fg-disabled text-primary-300" aria-hidden="true"
                            xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                            <path stroke="currentColor" stroke-linejoin="round" stroke-width="2"
                                d="M10 3v4a1 1 0 0 1-1 1H5m14-4v16a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7.914a1 1 0 0 1 .293-.707l3.914-3.914A1 1 0 0 1 9.914 3H18a1 1 0 0 1 1 1ZM9 12h2a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1v-2a1 1 0 0 1 1-1Zm5.697 2.395v-.733l1.269-1.219v2.984l-1.268-1.032Z">
                            </path>
                        </svg>
                        <span class="sr-only">Loading...</span>
                    </div>
                </div>
            </div>

        </div>


    </div>

    <div class="max-w-200 mx-auto p-8">
        <div class="divide-y divide-gray-200 overflow-hidden rounded-md bg-white shadow-sm">
            <div class="px-4 py-5 sm:px-6">
                Skeleton Media Gallery
            </div>
            <div class="px-4 py-5 sm:p-6 min-h-80 flex">
                <div role="status" class="skeleton skeleton-media-gallery">
                    <!-- Main Slide -->
                    <div class="skeleton-carousel-slide">
                        <div class="flex w-full p-2 justify-between items-center">
                            <div class="skeleton-btn skeleton-btn-prev">
                                <svg class="size-10 md:size-12 lg:size-14 text-primary-200 dark:text-white"
                                    aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                    fill="none" viewBox="0 0 24 24">
                                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                        stroke-width="1" d="m15 19-7-7 7-7" />
                                </svg>
                            </div>
                            <div class="skeleton-btn skeleton-btn-next">
                                <svg class="size-10 md:size-12 lg:size-14 text-primary-200 dark:text-white"
                                    aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                    fill="none" viewBox="0 0 24 24">
                                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                        stroke-width="1" d="m9 5 7 7-7 7" />
                                </svg>
                            </div>
                        </div>
                        <!-- Pagination -->
                        <div class="skeleton-pagination-dots">
                            <div class="skeleton-pagination-dot"></div>
                            <div class="skeleton-pagination-dot"></div>
                            <div class="skeleton-pagination-dot active"></div>
                            <div class="skeleton-pagination-dot"></div>
                            <div class="skeleton-pagination-dot"></div>
                        </div>
                        <svg class="absolute inset-0 m-auto size-20 text-fg-disabled text-primary-200"
                            aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none"
                            viewBox="0 0 24 24">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                stroke-width="1.25"
                                d="m3 16 5-7 6 6.5m6.5 2.5L16 13l-4.286 6M14 10h.01M4 19h16a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1Z" />
                        </svg>
                    </div>
                    <!-- Thumbnails -->
                    <div class="skeleton-media-gallery-thumbs">
                        <div class="skeleton-thumbnail-ring flex">
                            <svg class="size-8 sm:size-10 text-fg-disabled text-primary-200" aria-hidden="true"
                                xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none"
                                viewBox="0 0 24 24">
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                    stroke-width="1.25"
                                    d="m3 16 5-7 6 6.5m6.5 2.5L16 13l-4.286 6M14 10h.01M4 19h16a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1Z" />
                            </svg>
                        </div>
                        <div class="skeleton-thumbnail-ring flex">
                            <svg class="size-8 sm:size-10 text-fg-disabled text-primary-200" aria-hidden="true"
                                xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none"
                                viewBox="0 0 24 24">
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                    stroke-width="1.25"
                                    d="m3 16 5-7 6 6.5m6.5 2.5L16 13l-4.286 6M14 10h.01M4 19h16a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1Z" />
                            </svg>
                        </div>
                        <div class="skeleton-thumbnail-ring flex">
                            <svg class="size-8 sm:size-10 text-fg-disabled text-primary-200" aria-hidden="true"
                                xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none"
                                viewBox="0 0 24 24">
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                    stroke-width="1.25"
                                    d="m3 16 5-7 6 6.5m6.5 2.5L16 13l-4.286 6M14 10h.01M4 19h16a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1Z" />
                            </svg>
                        </div>
                        <div class="skeleton-thumbnail-ring hidden md:flex">
                            <svg class="size-8 sm:size-10 text-1fg-disabled text-primary-200" aria-hidden="true"
                                xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none"
                                viewBox="0 0 24 24">
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                    stroke-width="1.25"
                                    d="m3 16 5-7 6 6.5m6.5 2.5L16 13l-4.286 6M14 10h.01M4 19h16a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1Z" />
                            </svg>
                        </div>
                    </div>
                    <span class="sr-only">Loading...</span>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
