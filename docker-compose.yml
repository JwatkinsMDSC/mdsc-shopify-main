services:
  node-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mds-theme-dev
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    volumes:
      - .:/workspace
      - ~/.config:/workspace/.config
    ports:
      - "3000:3000"
      - "5173:5173"
      - "9292:9292"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - HOME=/workspace
    working_dir: /workspace
    stdin_open: true
    tty: true
    command: ["tail", "-f", "/dev/null"]

  theme-check:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mds-theme-check
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: ["theme-check", "."]


